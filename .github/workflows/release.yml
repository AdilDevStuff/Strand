name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgit2-dev libgl1 libegl1 libxkbcommon-x11-0

      - name: Install dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller build

      - name: Build standalone binaries and packages
        run: |
          python build.py --clean --package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/strand-*.tar.gz
            dist/strand-*.zip
            dist/strand-*.whl
            dist/SHA256SUMS.txt
          generate_release_notes: true
          name: "Strand ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
